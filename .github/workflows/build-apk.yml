name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate project and build APK
      run: |
        echo "=== Checking repository structure ==="
        ls -la
        
        # Determine correct path
        if [ -d "ST-University-Docs" ]; then
          TARGET_DIR="ST-University-Docs"
        elif [ -d "app" ]; then
          TARGET_DIR="."
        else
          # Search for folder containing gradlew
          TARGET_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        fi
        
        echo "Found project directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
